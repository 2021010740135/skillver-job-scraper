[project]
name = "boss-zhipin-scraper"
version = "2.12.0"
description = "Skillver 职位采集 — Chrome CDP + 标准岗分步 + Skillver CSV（当前含 BOSS 适配）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "skillver-job-scraper contributors" }
]
keywords = ["skillver", "jobs", "scraper", "cdp", "chrome", "agent-skill"]

dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
all = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.scripts]
# 模块路径对应 [tool.hatch.build.targets.wheel] 的 packages=["scripts"]，
# 安装后顶层包名为 scripts，故入口是 scripts.boss_cdp_raw:main
boss-scraper = "scripts.boss_cdp_raw:main"
boss-export-skillver = "scripts.export_skillver_csv:main"
boss-company-jobs = "scripts.scrape_company_jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
# 城市码表 data/city_codes.json 打进 wheel，pip install 后也能读到（见 issue #24）
[tool.hatch.build.targets.wheel.force-include]
"data/city_codes.json" = "data/city_codes.json"
"data/skillver/position_catalog.json" = "data/skillver/position_catalog.json"
"data/skillver/position_aliases.json" = "data/skillver/position_aliases.json"
"data/yatn/companies.csv" = "data/yatn/companies.csv"
