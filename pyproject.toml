[project]
name = "boss-zhipin-scraper"
version = "2.18.0"
description = "Skillver 职位采集 — Windows 浏览器 CDP（优先 Edge）+ 标准岗分步 + Skillver CSV（当前含 BOSS 适配）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "skillver-job-scraper contributors" }
]
keywords = ["skillver", "jobs", "scraper", "cdp", "chrome", "agent-skill"]

dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
all = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.scripts]
boss-chrome = "scripts.chrome_cdp:main"
boss-list = "scripts.scrape_list:main"
boss-details = "scripts.scrape_details:main"
boss-clean-classify = "scripts.clean_classify_input:main"
boss-clean-details = "scripts.clean_details:main"
boss-export-skillver = "scripts.export_skillver_csv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
# 城市码表 data/city_codes.json 打进 wheel，pip install 后也能读到（见 issue #24）
force-include = {
  "data/city_codes.json" = "data/city_codes.json",
  "data/position_catalog.json" = "data/position_catalog.json",
}

[tool.uv]
package = false
